<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{ title }} — Mirage</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 720px; margin: 40px auto; color: #1a1a1a; }
  header { border-bottom: 1px solid #ddd; padding-bottom: 12px; margin-bottom: 24px; }
  header .brand { font-weight: 700; color: #444; }
  .ticket, .product, .email { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .comment { background: #f7f7f7; border-radius: 4px; padding: 10px 12px; margin: 8px 0; }
  .comment .author { font-weight: 600; font-size: 0.9em; color: #555; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; background: #ffe8b3; }
  form { margin-top: 12px; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; }
  button { padding: 8px 14px; margin-top: 8px; }
  .hidden-payload { display: none; }
  iframe.embed { width: 100%; height: 60px; border: 1px dashed #ccc; }
</style>
</head>
<body>
<header><span class="brand">{{ brand }}</span> — {{ title }}</header>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/rrweb@2.0.0-alpha.4/dist/rrweb.min.js"></script>
<script>
(function () {
  var runId = new URLSearchParams(location.search).get("run_id") || "default";
  var buffer = [];

  function flush() {
    if (buffer.length === 0) return;
    var events = buffer;
    buffer = [];
    fetch("/replay-events?run_id=" + encodeURIComponent(runId), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ events: events }),
      keepalive: true,
    }).catch(function () {});
  }

  if (window.rrweb && window.rrweb.record) {
    window.rrweb.record({ emit: function (ev) { buffer.push(ev); } });
  }

  setInterval(flush, 2000);
  window.addEventListener("pagehide", flush);
  // callable from the runner right before it closes the browser, so the
  // final batch isn't lost to the 2s poll interval.
  window.__mirageFlushReplay = flush;
})();
</script>
</body>
</html>
